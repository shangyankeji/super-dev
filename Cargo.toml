# Super Dev — workspace manifest.
#
# Super Dev is a coach for AI coding hosts. One specification, one
# binary, three SDK runtimes (Anthropic / OpenAI / Google Antigravity).
# This workspace ships as a single static binary.

[workspace]
resolver = "2"
members = [
    "crates/super-dev",
    "crates/super-dev-spec",
    "crates/super-dev-governance",
    "crates/super-dev-agent",
    "crates/super-dev-runtime",
    "crates/super-dev-host",
    "crates/super-dev-tui",
]

[workspace.package]
version = "4.4.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Shangyan Technology <11964948@qq.com>"]
repository = "https://github.com/shangyankeji/super-dev"
homepage = "https://github.com/shangyankeji/super-dev"
description = "AI 编码的项目经理 — drives your logged-in Claude Code / Codex through a 9-phase commercial delivery pipeline. No API key needed."

[workspace.dependencies]
# --- runtime / async ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "signal", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"

# --- HTTP ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
eventsource-stream = "0.2"

# --- serde / data ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- error handling ---
anyhow = "1"
thiserror = "2"

# --- CLI ---
clap = { version = "4.5", features = ["derive", "env"] }

# --- TUI ---
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# --- governance / parsing ---
regex = "1.10"

# --- time ---
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# --- logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- archive ---
zip = { version = "2", default-features = false, features = ["deflate"] }

# --- testing ---
insta = { version = "1.41", features = ["json", "yaml"] }
pretty_assertions = "1"

# --- internal ---
super-dev-spec = { path = "crates/super-dev-spec", version = "4.4.0" }
super-dev-governance = { path = "crates/super-dev-governance", version = "4.4.0" }
super-dev-agent = { path = "crates/super-dev-agent", version = "4.4.0" }
super-dev-runtime = { path = "crates/super-dev-runtime", version = "4.4.0" }
super-dev-host = { path = "crates/super-dev-host", version = "4.4.0" }
super-dev-tui = { path = "crates/super-dev-tui", version = "4.4.0" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1
