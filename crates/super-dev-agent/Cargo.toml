[package]
name = "super-dev-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Super Dev Agent — the spec-aware orchestrator that drives the 9-phase pipeline."

[dependencies]
super-dev-spec = { workspace = true }
super-dev-governance = { workspace = true }
super-dev-runtime = { workspace = true }
super-dev-knowledge = { workspace = true }
super-dev-contract = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
zip = { workspace = true }

[features]
default = []
# Enable real HTTP embeddings in the knowledge crate. The binary enables this
# in its own [features] so the shipped binary supports hybrid retrieval; the
# library stays BM25-only by default for downstream embedders who want zero
# network deps.
vector = ["super-dev-knowledge/vector"]

[dev-dependencies]
tempfile = "3"
